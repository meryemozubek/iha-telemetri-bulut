services:
  postgres:
    image: postgres:15-alpine
    container_name: iha_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: iha_telemetri
      POSTGRES_USER: iha_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - iha_postgres_verileri:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iha_user -d iha_telemetri"]
      interval: 5s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana:12.3.0
    container_name: iha_grafana
    restart: unless-stopped

    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}

    ports:
      - "127.0.0.1:3000:3000"

    volumes:
      - iha_grafana_verileri:/var/lib/grafana
      - ./grafana/provisioning/datasources/datasource.yaml:/etc/grafana/provisioning/datasources/datasource.yaml:ro
      - ./grafana/provisioning/dashboards/dashboard.yaml:/etc/grafana/provisioning/dashboards/dashboard.yaml:ro
      - ./grafana/dashboard.json:/var/lib/grafana/dashboards/dashboard.json:ro

    depends_on:
      - postgres

  simulator:
    build: .
    image: iha-simulator:1.0
    container_name: iha_simulator

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: iha_telemetri
      POSTGRES_USER: iha_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  iha_postgres_verileri:
  iha_grafana_verileri: